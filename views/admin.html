<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiv Shakti Super Mart - VIP Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .backdrop-glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .glow-button { animation: pulseGlow 2s infinite; }
        @keyframes pulseGlow {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.7); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }
        .product-image-container { position: relative; width: 100%; padding-top: 100%; bg: #111827; }
    </style>
</head>
<body class="bg-[#070b14] min-h-screen text-slate-100 font-sans antialiased pb-24">

    <div class="bg-gradient-to-r from-amber-500 via-orange-600 to-red-600 text-slate-950 font-black text-center py-3 text-xs tracking-wide shadow-lg uppercase sticky top-0 z-40 backdrop-glass" id="top-announcement-banner">
        ⚡ LOADING EXCLUSIVE PREMIUM OFFERS FOR YOU... ⚡
    </div>

    <div class="max-w-md mx-auto px-4 pt-6">
        <header class="flex items-center justify-between mb-8 p-5 bg-white/5 backdrop-glass rounded-[28px] border border-white/10 shadow-2xl">
            <div class="flex items-center gap-3.5">
                <div class="w-12 h-12 bg-gradient-to-tr from-amber-400 to-orange-500 rounded-2xl flex items-center justify-center text-slate-950 shadow-md">
                    <i class="fa-solid fa-shop text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-tight text-white">Shiv Shakti Mart</h1>
                    <p class="text-[10px] text-emerald-400 font-bold tracking-wider flex items-center gap-1">
                        <span class="w-2 h-2 bg-emerald-500 rounded-full animate-ping"></span> AI ACTIVE STOCK
                    </p>
                </div>
            </div>
            <a href="/admin" class="w-10 h-10 bg-white/10 hover:bg-white/20 rounded-xl flex items-center justify-center text-white transition">
                <i class="fa-solid fa-user-gear text-sm"></i>
            </a>
        </header>

        <main class="grid grid-cols-2 gap-4" id="main-shop-catalog">
            </main>
    </div>

    <div id="product-detail-modal" class="fixed inset-0 bg-slate-950/90 backdrop-blur-md z-50 flex flex-col justify-end hidden">
        <div class="bg-[#0f172a] rounded-t-[40px] border-t border-white/10 p-6 max-w-md mx-auto w-full max-h-[90vh] overflow-y-auto">
            
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto mb-6 cursor-pointer" onclick="closePremiumModal()"></div>
            
            <div class="relative w-full aspect-square bg-[#111827] rounded-[24px] overflow-hidden border border-white/5 mb-5 shadow-inner">
                <img id="modal-main-view" src="" class="w-full h-full object-contain p-4">
            </div>

            <div class="flex gap-2.5 overflow-x-auto pb-4" id="modal-thumbnails-strip"></div>

            <div class="flex items-start justify-between mb-4">
                <div>
                    <h2 id="modal-product-name" class="text-xl font-black text-white leading-tight"></h2>
                    <span id="modal-product-cat" class="text-[10px] bg-white/10 px-2.5 py-1 rounded-md font-bold tracking-wider uppercase inline-block mt-2 text-slate-400"></span>
                </div>
                <div class="text-right">
                    <p class="text-2xl font-black text-amber-400" id="modal-product-price"></p>
                    <p class="text-[9px] text-slate-500 line-through font-bold">MRP ₹999</p>
                </div>
            </div>

            <div class="bg-red-950/30 border border-red-900/40 rounded-2xl p-4 mb-6 flex items-center gap-3">
                <div class="w-3 h-3 bg-red-500 rounded-full animate-pulse"></div>
                <p class="text-xs font-bold text-red-400 tracking-wide">AI Stock Alert: Sirf 2 piece bache hain! Turant order karein.</p>
            </div>

            <div class="grid grid-cols-2 gap-4 pt-2">
                <a id="modal-call-btn" href="#" class="bg-gradient-to-r from-blue-600 to-indigo-700 text-white py-4 rounded-2xl font-black text-center text-xs tracking-wider flex items-center justify-center gap-2 shadow-lg transition transform active:scale-95 border border-blue-500/30">
                    <i class="fa-solid fa-phone"></i> Call Order
                </a>
                <a id="modal-wa-btn" href="#" target="_blank" class="glow-button bg-gradient-to-r from-emerald-500 to-green-600 text-slate-950 py-4 rounded-2xl font-black text-center text-xs tracking-wider flex items-center justify-center gap-2 shadow-lg transition transform active:scale-95">
                    <i class="fa-brands fa-whatsapp text-sm"></i> WhatsApp Order
                </a>
            </div>
        </div>
    </div>

    <script>
        let globalCatalog = [];

        async function initShop() {
            try {
                // Fetch dynamic announcement text loop
                const bRes = await fetch('/api/ai-banner');
                const bData = await bRes.json();
                if(bData && bData.text) {
                    document.getElementById('top-announcement-banner').innerText = `✨ ${bData.text} ✨`;
                }

                // Fetch unified item array
                const pRes = await fetch('/api/products');
                globalCatalog = await pRes.json();
                renderShopCatalog();
            } catch(e) { console.error("Shop bootstrap error layout:", e); }
        }

        function renderShopCatalog() {
            const grid = document.getElementById('main-shop-catalog');
            grid.innerHTML = '';

            if(globalCatalog.length === 0) {
                grid.className = "col-span-2 text-center py-12 text-slate-500 text-xs font-bold";
                grid.innerHTML = `<i class="fa-solid fa-boxes-empty text-3xl mb-2 block"></i> Dukan me maal khatam hai.`;
                return;
            }

            globalCatalog.forEach(p => {
                let thumb = 'https://via.placeholder.com/150';
                if(p.images && p.images.length > 0) thumb = p.images[0];
                else if(p.image) thumb = p.image;

                const card = document.createElement('div');
                card.className = "bg-white/5 border border-white/5 rounded-[24px] p-3 flex flex-col justify-between gap-3 shadow-md cursor-pointer transition transform active:scale-98 hover:border-white/10";
                card.setAttribute('onclick', `openPremiumModal('${p._id}')`);
                
                card.innerHTML = `
                    <div class="w-full pt-[100%] relative bg-[#111827] rounded-xl overflow-hidden">
                        <img src="${thumb}" class="absolute inset-0 w-full h-full object-contain p-2">
                    </div>
                    <div>
                        <h3 class="font-bold text-xs text-white line-clamp-1">${p.name}</h3>
                        <div class="flex items-center justify-between mt-1.5">
                            <span class="text-sm font-black text-amber-400">₹${p.price}</span>
                            <span class="text-[9px] text-slate-400 bg-white/10 px-1.5 py-0.5 rounded-sm font-bold">DEKHEIN</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function openPremiumModal(id) {
            const item = globalCatalog.find(p => p._id === id);
            if(!item) return;

            // Log click analytics silently
            fetch(`/api/products/click/${id}`, { method: 'POST' }).catch(() => {});

            document.getElementById('modal-product-name').innerText = item.name;
            document.getElementById('modal-product-cat').innerText = item.category || 'General';
            document.getElementById('modal-product-price').innerText = `₹${item.price}`;

            // Populate multiple slider thumbnails
            const strip = document.getElementById('modal-thumbnails-strip');
            strip.innerHTML = '';
            
            let allPics = [];
            if(item.images && item.images.length > 0) allPics = item.images;
            else if(item.image) allPics = [item.image];
            else allPics = ['https://via.placeholder.com/150'];

            // Initialize main image window
            document.getElementById('modal-main-view').src = allPics[0];

            allPics.forEach((imgUrl, idx) => {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = `w-14 h-14 object-cover rounded-xl border cursor-pointer p-1 bg-[#111827] ${idx === 0 ? 'border-amber-400' : 'border-white/10'}`;
                img.onclick = function() {
                    document.getElementById('modal-main-view').src = imgUrl;
                    Array.from(strip.children).forEach(c => c.classList.remove('border-amber-400'));
                    img.classList.add('border-amber-400');
                };
                strip.appendChild(img);
            });

            // Lock destination links
            document.getElementById('modal-call-btn').href = `tel:+919211334455`; // Replace with dad's/your number if needed
            document.getElementById('modal-wa-btn').href = `https://wa.me/919211334455?text=${encodeURIComponent('Hi Vishnu Duttji, Mujhe ye saman chahiye:\n\nSaman: ' + item.name + '\nRate: ₹' + item.price)}`;

            document.getElementById('product-detail-modal').classList.remove('hidden');
        }

        function closePremiumModal() {
            document.getElementById('product-detail-modal').classList.add('hidden');
        }

        window.onload = initShop;
    </script>
</body>
</html>
