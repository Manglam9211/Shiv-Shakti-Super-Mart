<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Super Admin - Shakti Mart</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #ff6b00; --dark: #1a1a1a; --bg: #f8f9fa; --danger: #dc3545; --success: #28a745; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background: var(--bg); padding: 15px; color: var(--dark); }
        .lock-screen { position: fixed; top:0; left:0; width:100%; height:100%; background:var(--dark); z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; }
        .lock-box { text-align:center; background:#2a2a2a; padding:30px; border-radius:15px; width:90%; max-width:350px; }
        .container { max-width: 600px; margin: 0 auto; display:none; }
        .card-panel { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid #eee; }
        h2, h3 { margin-bottom: 15px; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .stats-grid { display: flex; gap: 10px; margin-bottom: 15px; }
        .stat-card { flex: 1; background: #1e3c72; color: white; padding: 15px; border-radius: 12px; text-align: center; }
        .stat-card.profit { background: #11998e; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-weight: 600; margin-bottom: 4px; font-size: 13px; }
        input, select, textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; outline: none; }
        .btn { background: var(--primary); color: white; border: none; padding: 12px; width: 100%; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 14px; margin-top: 5px; }
        .btn-success { background: var(--success); }
        .product-item { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 10px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #eee; }
        .product-item img { width: 45px; height: 45px; object-fit: contain; }
        .delete-btn { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; }
        .qr-btn { background: #007bff; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; margin-right: 5px; }
    </style>
</head>
<body>

<div id="lockScreen" class="lock-screen">
    <div class="lock-box">
        <h2><i class="fa-solid fa-shield-halved"></i> Security Check</h2>
        <p style="margin-bottom:15px; color:#aaa;">Shiv Shakti Mart Secret PIN dalein:</p>
        <input type="password" id="pinInput" placeholder="🔒 PIN" style="text-align:center; font-size:20px; margin-bottom:15px;" maxlength="4">
        <button class="btn" onclick="verifyPin()">Open Panel</button>
    </div>
</div>

<div class="container" id="adminContainer">
    <div class="card-panel">
        <h2><i class="fa-solid fa-chart-line"></i> AI Dashboard</h2>
        <div class="stats-grid">
            <div class="stat-card">
                <div style="font-size:11px;">Total Clicks (Demand Meter)</div>
                <div id="totalClicks" style="font-size:20px; font-weight:bold;">0</div>
            </div>
            <div class="stat-card profit">
                <div style="font-size:11px;">Estimated Profit Module</div>
                <div id="profitEstimate" style="font-size:20px; font-weight:bold;">₹0</div>
            </div>
        </div>
    </div>

    <div class="card-panel" style="background: #fff8f0;">
        <h3><i class="fa-solid fa-robot"></i> Festival Automation Engine</h3>
        <div class="form-group">
            <label>Offer Banner Matrix Text:</label>
            <input type="text" id="bannerTextInput" placeholder="e.g. ✨ DIWALI DHAMAKA: 20% OFF ✨">
        </div>
        <button class="btn" onclick="updateAiBanner()">Push Live Banner</button>
        <button class="btn btn-success" onclick="triggerAiWhatsappBlast()"><i class="fa-brands fa-whatsapp"></i> AI WhatsApp Blast (Highest Demand)</button>
    </div>

    <div class="card-panel">
        <h3><i class="fa-solid fa-box-open"></i> Add New Product (Gallery)</h3>
        <form id="uploadForm" enctype="multipart/form-data">
            <div class="form-group">
                <label>Saman Ka Name:</label>
                <input type="text" name="name" required placeholder="Wiper, Copy, etc.">
            </div>
            <div class="form-group">
                <label>Sale Price (Rs):</label>
                <input type="number" name="price" required>
            </div>
            <div class="form-group">
                <label>Wholesale Cost (For Profit Tracker):</label>
                <input type="number" name="costPrice" required placeholder="Jitne me kharida tha">
            </div>
            <div class="form-group">
                <label>Details / Description:</label>
                <textarea name="description"></textarea>
            </div>
            <div class="form-group">
                <label>Saman Ki Photo (Gallery/Camera):</label>
                <input type="file" name="image" accept="image/*" required>
            </div>
            <button type="submit" class="btn">Upload & Save to Cloudinary</button>
        </form>
    </div>

    <div class="card-panel">
        <h3><i class="fa-solid fa-list-check"></i> Stock & Delete Control</h3>
        <div id="adminProductGrid"></div>
    </div>
</div>

<script>
    // FIXED PASSWORD SHIELD TO 7181 AS REQUESTED
    function verifyPin() {
        if(document.getElementById('pinInput').value === "7181") {
            document.getElementById('lockScreen').style.display = 'none';
            document.getElementById('adminContainer').style.display = 'block';
            loadAdminPanel();
        } else { alert("Galat PIN! Kripya sahi password dalein."); }
    }

    async function loadAdminPanel() {
        const res = await fetch('/api/products');
        const products = await res.json();
        let totalClicks = 0, estimatedProfit = 0;
        const grid = document.getElementById('adminProductGrid');
        grid.innerHTML = '';

        products.forEach(p => {
            totalClicks += (p.clicks || 0);
            if(p.price && p.costPrice) { estimatedProfit += ((p.price - p.costPrice) * (p.clicks || 1)); }
            let imgUrl = p.image || 'https://via.placeholder.com/50';
            grid.innerHTML += `
                <div class="product-item">
                    <img src="${imgUrl}">
                    <div style="flex-grow:1; margin-left:10px;">
                        <div style="font-weight:bold; font-size:14px;">${p.name}</div>
                        <div style="color:var(--primary); font-size:12px;">₹${p.price} | Clicks: ${p.clicks || 0}</div>
                    </div>
                    <button class="qr-btn" onclick="generateQr('${p.name}', ${p.price})"><i class="fa-solid fa-qrcode"></i></button>
                    <button class="delete-btn" onclick="deleteItem('${p._id}')"><i class="fa-solid fa-trash"></i> Delete</button>
                </div>
            `;
        });
        document.getElementById('totalClicks').innerText = totalClicks;
        document.getElementById('profitEstimate').innerText = '₹' + estimatedProfit;
    }

    async function updateAiBanner() {
        const txt = document.getElementById('bannerTextInput').value;
        await fetch('/api/ai-banner', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ text: txt, active: true })
        });
        alert("Banner Live ho gaya!");
    }

    async function triggerAiWhatsappBlast() {
        const res = await fetch('/api/ai-whatsapp-blast');
        const data = await res.json();
        if(data.success) { window.open(`https://wa.me/?text=${encodeURIComponent(data.message)}`, '_blank'); }
        else { alert("Dukan khali hai."); }
    }

    function generateQr(name, price) {
        window.open(`https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${encodeURIComponent('Item: '+name+' | Price: Rs.'+price)}`, '_blank');
    }

    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const formData = new FormData(e.target);
        const res = await fetch('/api/products', { method: 'POST', body: formData });
        if(res.ok) { alert("Saman directly Cloudinary gallery me save ho gaya!"); e.target.reset(); loadAdminPanel(); }
    });

    async function deleteItem(id) {
        if(confirm("Kya aap ise hatana chahte hain?")) {
            await fetch(`/api/products/${id}`, { method: 'DELETE' });
            loadAdminPanel();
        }
    }
</script>
</body>
</html>
