<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiv Shakti Super Mart - Admin Panel</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

    <header>
        <h1 class="display-4 font-weight-bold">Shiv Shakti Super Mart</h1>
        <h2>Admin Panel - Saman Jodein</h2>
        <p><a href="/" class="back-link"> Go to Main Page </a></p>
    </header>

    <main class="admin-container">
        <div class="form-container">
            <h3>Naya Saman Jodein</h3>
            <form action="/admin/add" method="POST" enctype="multipart/form-data">
                <div class="form-group">
                    <label>Saman Ka Naam (Product Name):</label>
                    <input type="text" name="name" placeholder="Example: Class 12 Math Book" required>
                </div>
                
                <div class="form-group">
                    <label>Keemat / Price (Rs):</label>
                    <input type="number" name="price" placeholder="Example: 150" required>
                </div>

                <div class="form-group">
                    <label>Saman ki Detail (Description):</label>
                    <textarea name="description" placeholder="Example: UP Board NCERT Pattern Book" required></textarea>
                </div>

                <div class="form-group">
                    <label>Category Chunnein:</label>
                    <select name="category">
                        <option value="Stationery">Stationery</option>
                        <option value="Books">Books</option>
                        <option value="Toys">Toys</option>
                        <option value="Household">Household Goods</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Saman ki Photo:</label>
                    <input type="file" name="image" accept="image/*" required>
                </div>

                <button type="submit" class="btn-submit">Saman Add Karein (Save)</button>
            </form>
        </div>

        <div class="list-container">
            <h3>Dukan Me Maujood Saman</h3>
            <table>
                <thead>
                    <tr>
                        <th>Photo</th>
                        <th>Naam</th>
                        <th>Keemat</th>
                        <th>Category</th>
                    </tr>
                </thead>
                <tbody id="adminProductTable">
                    </tbody>
            </table>
        </div>
    </main>

    <script>
        async function loadAdminProducts() {
            const response = await fetch('/api/products');
            const products = await response.json();
            const tbody = document.getElementById('adminProductTable');
            tbody.innerHTML = '';
            products.forEach(p => {
                tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.image}" style="width:50px; height:50px; object-fit:cover;"></td>
                        <td><b>${p.name}</b></td>
                        <td>Rs. ${p.price}</td>
                        <td>${p.category}</td>
                    </tr>
                `;
            });
        }
        window.onload = loadAdminProducts;
    </script>
</body>
</html>
