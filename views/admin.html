<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - VIP Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-b from-[#f8fafc] via-[#f1f5f9] to-[#e2e8f0] min-h-screen font-sans pb-16 text-slate-700">

    <div id="security-gate" class="fixed inset-0 bg-[#0f172a] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[28px] p-8 w-full max-w-sm border border-slate-200 text-center shadow-2xl">
            <div class="w-16 h-16 bg-orange-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-orange-200">
                <i class="fa-solid fa-lock text-orange-600 text-2xl"></i>
            </div>
            <h2 class="text-xl font-black text-slate-900 mb-2">Enter Admin PIN</h2>
            <p class="text-xs text-slate-500 mb-6">VIP Control Panel kholne ke liye PIN dalein</p>
            <input type="password" id="pin-input" placeholder="••••" maxlength="4" class="w-full bg-slate-50 border-2 border-slate-300 text-center py-3 rounded-xl mb-6 text-3xl font-black text-slate-900 tracking-widest outline-none focus:border-orange-500 transition">
            <button onclick="verifyPin()" type="button" class="w-full bg-orange-500 hover:bg-orange-600 text-white py-3.5 rounded-xl font-black text-sm shadow-md transition">Verify Access</button>
        </div>
    </div>

    <div id="admin-dashboard" class="max-w-2xl mx-auto px-4 pt-6 hidden">
        
        <header class="flex items-center justify-between mb-6 p-5 bg-white border border-slate-200 rounded-[24px] shadow-sm">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-[#0f172a] rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-user-shield text-orange-400 text-base"></i>
                </div>
                <div>
                    <h1 class="font-black text-base text-slate-900 tracking-tight">Shiv Shakti Control Hub</h1>
                    <p class="text-[10px] text-orange-600 uppercase font-bold tracking-wider">Agrahunda Super Mart</p>
                </div>
            </div>
            <a href="/" class="bg-slate-100 border border-slate-200 text-slate-700 px-4 py-2 rounded-xl text-xs font-black hover:bg-slate-200 transition">Live Shop Dekhein</a>
        </header>

        <div class="p-5 rounded-2xl bg-white border border-slate-200 shadow-sm mb-6">
            <h3 class="font-black text-slate-800 text-xs uppercase tracking-wider mb-3 flex items-center gap-2">
                <i class="fa-solid fa-bullhorn text-orange-500"></i> Change Live Banner Offer Text (e.g. 30% OFF)
            </h3>
            <div class="flex gap-3">
                <input type="text" id="banner-text-input" placeholder="💥 Offer Text..." class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-900 rounded-xl outline-none focus:border-orange-500 transition">
                <button onclick="updateLiveBanner()" class="bg-[#0f172a] hover:bg-slate-800 text-orange-400 font-black text-xs px-5 rounded-xl transition whitespace-nowrap">Change Banner</button>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-6">
            <div class="bg-white border border-slate-200 p-5 rounded-2xl shadow-sm">
                <span class="text-[10px] uppercase font-black text-slate-400 block mb-1 tracking-wider">Total Product Views</span>
                <span id="total-clicks" class="text-2xl font-black text-slate-900">0</span>
            </div>
            <div class="bg-white border border-slate-200 p-5 rounded-2xl border-l-4 border-emerald-500 shadow-sm">
                <span class="text-[10px] uppercase font-black text-slate-400 block mb-1 tracking-wider">Estimated Traffic Profit</span>
                <span id="total-profit" class="text-2xl font-black text-emerald-600">₹0</span>
            </div>
        </div>

        <div class="p-6 rounded-2xl bg-white border border-slate-200 shadow-sm mb-6">
            <h3 class="font-black text-slate-800 text-sm uppercase tracking-wider mb-4 flex items-center gap-2">
                <i class="fa-solid fa-box-open text-orange-500"></i> Naya Stock Chadhayein
            </h3>
            <form id="advanced-upload-form" class="flex flex-col gap-4">
                <input type="text" id="p-name" required placeholder="Saman Ka Naam (e.g. Wiper, Dustbin)" class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-900 rounded-xl outline-none focus:border-orange-500 transition">
                
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-cost" required placeholder="Kharidi Rate (₹)" class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-900 rounded-xl outline-none focus:border-orange-500 transition">
                    <input type="number" id="p-price" required placeholder="Bechne Ka Rate (₹)" class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-900 rounded-xl outline-none focus:border-orange-500 transition">
                </div>

                <select id="p-cat" class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-700 rounded-xl outline-none focus:border-orange-500 transition">
                    <option value="General">General Grocery</option>
                    <option value="Stationery">Stationery & Books</option>
                    <option value="Toys">Toys & Games</option>
                    <option value="Household">Household Goods</option>
                </select>

                <textarea id="p-desc" placeholder="Saman ki Quality / Description" rows="3" class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-900 rounded-xl outline-none resize-none focus:border-orange-500 transition"></textarea>
                
                <div class="bg-slate-50 border border-dashed border-slate-300 p-4 rounded-xl">
                    <label class="block text-xs font-black text-slate-500 mb-2 uppercase tracking-wider">Saman ki Photos Chunein (Ek sath 6-7 photos select karein)</label>
                    <input type="text" id="p-images" required placeholder="यहाँ फोटो का इंटरनेट लिंक पेस्ट करें" class="w-full bg-slate-50 border border-slate-300 p-3.5 text-sm text-slate-700 rounded-xl">    
                </div>
  
                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-black text-xs py-3.5 rounded-xl mt-2 transition shadow-sm">Saman ko Live Dukan Par Chadhayein</button>
            </form>
        </div>

        <div class="mb-4 flex items-center justify-between">
            <h3 class="font-black text-slate-900 text-base tracking-tight">Dukan ka Stock List</h3>
            <button onclick="triggerAIMarketingBlast()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-white px-4 py-2 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-bolt"></i> AI WhatsApp Blast
            </button>
        </div>

        <div id="admin-products-list" class="grid grid-cols-2 gap-4"></div>
    </div>

    <script>
        let productsData = [];

        function verifyPin() {
            if(document.getElementById('pin-input').value === '7181') {
                document.getElementById('security-gate').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                fetchAdminMetrics();
                loadCurrentBanner();
            } else { 
                alert("Galat PIN! Access Denied."); 
                document.getElementById('pin-input').value = '';
            }
        }

        async function loadCurrentBanner() {
            const res = await fetch('/api/ai-banner');
            const data = await res.json();
            if(data && data.text) document.getElementById('banner-text-input').value = data.text;
        }

        async function updateLiveBanner() {
            const txt = document.getElementById('banner-text-input').value;
            const res = await fetch('/api/ai-banner', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text: txt })
            });
            if(res.ok) alert("Dukan ka Top Banner badal gaya! 📢");
            else alert("Banner update failed.");
        }

        async function fetchAdminMetrics() {
            const pRes = await fetch('/api/products');
            productsData = await pRes.json();
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            let totalClicks = 0, totalProfit = 0;

            productsData.forEach(p => {
                totalClicks += p.clicks || 0;
                let profitPerClick = p.price - (p.costPrice || 0);
                totalProfit += (profitPerClick * (p.clicks || 0));

                const mainImg = p.images && p.images.length > 0 ? p.images[0] : '/public/uploads/placeholder.png';

                const card = document.createElement('div');
                card.className = "p-4 bg-white border border-slate-200 rounded-2xl flex flex-col justify-between gap-3 shadow-sm";
                card.innerHTML = `
                    <div class="relative bg-slate-50 rounded-xl p-2 h-32 flex items-center justify-center overflow-hidden border border-slate-100 shadow-inner">
                        <img src="${mainImg}" class="max-w-full max-h-full object-contain rounded-lg">
                        <span class="absolute top-2 right-2 bg-black/70 px-2 py-0.5 rounded-md text-[10px] font-black text-orange-400 border border-white/10"><i class="fa-solid fa-eye mr-1"></i>${p.clicks || 0}</span>
                    </div>
                    <div>
                        <h4 class="font-black text-xs text-slate-800 truncate">${p.name}</h4>
                        <p class="text-[10px] text-slate-500 mt-0.5">Rate: ₹${p.price} | Profit: <span class="text-emerald-600 font-bold">₹${profitPerClick}</span></p>
                    </div>
                    <button onclick="deleteProduct('${p._id}')" class="w-full bg-red-50 border border-red-200 text-red-600 hover:bg-red-600 hover:text-white font-black text-[11px] py-2.5 rounded-xl transition">Hatayein</button>
                `;
                list.appendChild(card);
            });
            document.getElementById('total-clicks').innerText = totalClicks;
            document.getElementById('total-profit').innerText = `₹${totalProfit}`;
        }

        document.getElementById('advanced-upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Chadh raha hai...";
            btn.disabled = true;

            const productData = {
                name: document.getElementById('p-name').value,
                costPrice: document.getElementById('p-cost').value,
                price: document.getElementById('p-price').value,
                category: document.getElementById('p-cat').value,
                description: document.getElementById('p-desc').value,
                photo: document.getElementById('p-images').value
            };

            try {
                const response = await fetch('/api/products', { 
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(productData)
                });
                const result = await response.json();
                if (response.ok && result.success) {
                    alert("सफलता! नया सामान दुकान पर लाइव हो गया। 🛍️");
                    document.getElementById('advanced-upload-form').reset();
                    fetchAdminMetrics();
                } else { 
                    alert("Upload fail. Server error."); 
                }
            } catch (error) { 
                alert("Upload fail. Connection error."); 
            }
            
            btn.innerText = "Saman ko Live Dukan Par Chadhayein";
            btn.disabled = false;
        });

        async function triggerAIMarketingBlast() {
            try {
                const res = await fetch('/api/ai-marketing/blast');
                const data = await res.json();
                if(data.success) { 
                    window.open(`https://wa.me/?text=${encodeURIComponent(data.text)}`, '_blank'); 
                } else { 
                    alert("Stock khali hai."); 
                }
            } catch(e) { 
                alert("AI Engine error."); 
            }
        }

        async function deleteProduct(id) {
            if(confirm("क्या आप वाकई इस सामान को दुकान से हटाना चाहते हैं?")) {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                alert("सामान दुकान से हटा दिया गया है! 🗑️");
                fetchAdminMetrics();
            }
        }
    </script>
</body>
</html>
