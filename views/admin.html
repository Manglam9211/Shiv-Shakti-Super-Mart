<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control Panel - VIP Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#0b1120] min-h-screen font-sans pb-16 text-slate-300">

    <div id="security-gate" class="fixed inset-0 bg-[#070b14] z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-[32px] p-7 w-full max-w-sm shadow-2xl text-center">
            <h2 class="text-xl font-black text-slate-900 mb-4">Enter Admin PIN</h2>
            <input type="password" id="pin-input" placeholder="••••" class="w-full border-2 border-slate-200 text-center py-4 rounded-2xl mb-5 text-4xl font-black text-slate-900 outline-none">
            <button onclick="verifyPin()" type="button" class="w-full bg-[#111827] text-white py-4 rounded-2xl font-bold shadow-md transition">Verify Access</button>
        </div>
    </div>

    <div id="admin-dashboard" class="max-w-2xl mx-auto px-4 pt-6 hidden">
        <header class="flex items-center justify-between mb-8 p-5 bg-white/5 rounded-[24px] border border-white/5 shadow-xl">
            <h1 class="font-black text-xl text-white">Dukan ka Control Panel</h1>
            <a href="/" class="bg-white/10 text-white px-4 py-2 rounded-xl text-xs font-bold">Shop Dekhein</a>
        </header>

        <div class="grid grid-cols-2 gap-4 mb-8">
            <div class="bg-white/5 p-5 rounded-3xl border border-white/5">
                <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Total Grahak Click</span>
                <span id="total-clicks" class="text-3xl font-black text-white">0</span>
            </div>
            <div class="bg-white/5 p-5 rounded-3xl border border-white/5">
                <span class="text-[10px] uppercase font-bold text-slate-400 block mb-1">Aapka Net Munafa</span>
                <span id="total-profit" class="text-3xl font-black text-emerald-400">₹0</span>
            </div>
        </div>

        <div class="p-6 rounded-3xl bg-white/5 border border-white/5 mb-8">
            <form id="old-upload-form" class="flex flex-col gap-4">
                <input type="text" id="p-name" required placeholder="Saman Ka Naam" class="w-full bg-[#111827] border p-4 text-sm text-white rounded-xl outline-none">
                <div class="grid grid-cols-2 gap-4">
                    <input type="number" id="p-cost" required placeholder="Kharidi Rate" class="w-full bg-[#111827] border p-4 text-sm text-white rounded-xl outline-none">
                    <input type="number" id="p-price" required placeholder="Bechne Ka Rate" class="w-full bg-[#111827] border p-4 text-sm text-white rounded-xl outline-none">
                </div>
                <select id="p-cat" class="w-full bg-[#111827] border p-4 text-sm text-white rounded-xl outline-none">
                    <option value="General">General Grocery</option>
                    <option value="Stationery">Stationery & Books</option>
                    <option value="Toys">Toys & Games</option>
                    <option value="Household">Household Goods</option>
                </select>
                <textarea id="p-desc" placeholder="Saman ki Quality / Description" rows="3" class="w-full bg-[#111827] border p-4 text-sm text-white rounded-xl outline-none resize-none"></textarea>
                <input type="file" id="p-images" multiple accept="image/*" required class="w-full bg-[#111827] p-3.5 text-sm rounded-xl text-slate-500">
                <button type="submit" id="submit-btn" class="w-full bg-emerald-600 text-white font-black text-xs py-4 rounded-xl mt-2">Saman ko Live Dukan Par Chadhayein</button>
            </form>
        </div>

        <div class="mb-8 flex items-center justify-between">
            <h3 class="font-black text-white text-base">Dukan ka Stock List</h3>
            <button onclick="triggerAIMarketingBlast()" class="bg-gradient-to-r from-orange-500 to-amber-500 text-slate-950 px-4 py-2 rounded-xl text-xs font-black shadow-lg">
                <i class="fa-solid fa-bolt mr-1"></i> AI WhatsApp Blast
            </button>
        </div>

        <div id="admin-products-list" class="grid grid-cols-2 gap-4"></div>
    </div>

    <script>
        let productsData = [];
        function verifyPin() {
            if(document.getElementById('pin-input').value === '7181') {
                document.getElementById('security-gate').classList.add('hidden');
                document.getElementById('admin-dashboard').classList.remove('hidden');
                fetchAdminMetrics();
            } else { alert("Galat PIN!"); }
        }
        async function fetchAdminMetrics() {
            const pRes = await fetch('/api/products');
            productsData = await pRes.json();
            const list = document.getElementById('admin-products-list');
            list.innerHTML = '';
            let totalClicks = 0, totalProfit = 0;

            productsData.forEach(p => {
                totalClicks += p.clicks || 0;
                totalProfit += ((p.price - (p.costPrice || 0)) * (p.clicks || 0));

                const card = document.createElement('div');
                card.className = "p-4 rounded-3xl bg-white/5 border flex flex-col justify-between gap-3";
                card.innerHTML = `
                    <img src="${p.image || p.images[0]}" class="w-full h-32 object-contain rounded-2xl">
                    <h4 class="font-bold text-xs text-white">${p.name}</h4>
                    <p class="text-[10px] text-slate-400">Rate: ₹${p.price}</p>
                    <button onclick="deleteProduct('${p._id}')" class="w-full bg-red-900/40 text-red-400 font-bold text-[11px] py-2 rounded-xl">Hatayein</button>
                `;
                list.appendChild(card);
            });
            document.getElementById('total-clicks').innerText = totalClicks;
            document.getElementById('total-profit').innerText = `₹${totalProfit}`;
        }

        document.getElementById('old-upload-form').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "Chadh raha hai...";
            btn.disabled = true;

            const formData = new FormData();
            formData.append('name', document.getElementById('p-name').value);
            formData.append('costPrice', document.getElementById('p-cost').value);
            formData.append('price', document.getElementById('p-price').value);
            formData.append('category', document.getElementById('p-cat').value);
            formData.append('description', document.getElementById('p-desc').value);

            const fileInput = document.getElementById('p-images');
            for (let i = 0; i < fileInput.files.length; i++) {
                formData.append('image', fileInput.files[i]);
            }

            const response = await fetch('/api/products', { method: 'POST', body: formData });
            if (response.ok) {
                alert("Saman live ho gaya!");
                document.getElementById('old-upload-form').reset();
                fetchAdminMetrics();
            } else { alert("Upload fail."); }
            btn.innerText = "Saman ko Live Dukan Par Chadhayein";
            btn.disabled = false;
        });

        async function triggerAIMarketingBlast() {
            try {
                const res = await fetch('/api/ai-marketing/blast');
                const data = await res.json();
                if(data.success) {
                    window.open(`https://wa.me/?text=${encodeURIComponent(data.text)}`, '_blank');
                } else { alert("Stock khali hai."); }
            } catch(e) { console.error(e); }
        }

        async function deleteProduct(id) {
            if(confirm("Saman hatayein?")) {
                await fetch(`/api/products/${id}`, { method: 'DELETE' });
                fetchAdminMetrics();
            }
        }
    </script>
</body>
</html>
