<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiv Shakti Super Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .backdrop-glass { backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
        .sticky-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(255, 255, 255, 0.85); border-top: 1px solid rgba(229, 231, 235, 0.5); z-index: 50; }
        .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        @keyframes pulse-subtle { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.02); } }
        .pulse-btn { animation: pulse-subtle 2s infinite ease-in-out; }
    </style>
</head>
<body class="bg-slate-50 pb-28 font-sans text-slate-800 antialiased">

    <div id="ai-banner" class="bg-gradient-to-r from-amber-500 via-orange-500 to-red-500 text-white text-center py-2 text-xs font-extrabold tracking-wider shadow-sm hidden select-none animate-shimmer">
        <span id="banner-text">✨ Welcome to Shiv Shakti Super Mart ✨</span>
    </div>

    <header class="bg-slate-900 text-white px-4 pt-7 pb-7 rounded-b-[24px] shadow-xl text-center relative overflow-hidden">
        <div class="absolute inset-0 bg-gradient-to-b from-transparent to-slate-950/40 pointer-events-none"></div>
        <h1 class="text-3xl font-black tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-orange-400 to-yellow-300 relative z-10">
            Shiv Shakti <span class="text-white font-light text-2xl">Super Mart</span>
        </h1>
        <p class="text-[11px] text-slate-400 mt-1.5 flex items-center justify-center gap-1 font-medium relative z-10">
            <i class="fa-solid fa-brain text-orange-400 text-xs"></i> Intelligent Sync Engine Active
        </p>
        
        <div class="flex justify-center gap-2.5 mt-4 text-xs relative z-10">
            <span class="bg-slate-800/90 backdrop-glass px-3.5 py-1.5 rounded-full border border-slate-700/60 font-semibold flex items-center gap-1.5 shadow-sm text-slate-200">
                <i class="fa-solid fa-location-dot text-orange-500"></i> Agrahunda, Chitrakoot
            </span>
            <a href="/admin" class="bg-slate-800/90 backdrop-glass hover:bg-slate-700 px-3.5 py-1.5 rounded-full border border-slate-700/60 font-semibold flex items-center gap-1.5 transition active:scale-95 shadow-sm text-slate-200">
                <i class="fa-solid fa-circle-user text-amber-400"></i> Admin Panel
            </a>
        </div>

        <button id="lang-btn" onclick="toggleLanguage()" class="absolute top-4 right-4 bg-white/10 hover:bg-white/20 active:scale-95 text-slate-300 hover:text-white px-2.5 py-1 rounded-lg text-xs font-bold border border-white/10 transition backdrop-glass">
            EN
        </button>
    </header>

    <main class="max-w-md mx-auto px-4 mt-6">
        
        <div class="relative flex items-center mb-4 shadow-xs">
            <i class="fa-solid fa-magnifying-glass absolute left-4 text-slate-400"></i>
            <input type="text" id="search-input" oninput="filterProducts()" placeholder="Saman ka naam dhundhein" class="w-full pl-11 pr-12 py-3.5 bg-white rounded-2xl border border-slate-200/80 focus:outline-none focus:ring-2 focus:ring-orange-500/50 text-sm font-medium shadow-xs transition-all">
            <button onclick="startVoiceSearch()" class="absolute right-3 p-2 text-orange-500 hover:bg-orange-50 rounded-xl transition active:scale-90" title="Voice Search">
                <i class="fa-solid fa-microphone text-base"></i>
            </button>
        </div>

        <div class="relative mb-6">
            <button id="category-trigger" onclick="toggleCategoryMenu()" class="w-full bg-slate-950 text-white py-3.5 px-5 rounded-2xl font-bold flex items-center justify-between shadow-md hover:bg-slate-900 transition active:scale-[0.99]">
                <span id="cat-title" class="flex items-center gap-2">⚡ Sabhi Saman (All)</span>
                <i class="fa-solid fa-chevron-down text-xs text-slate-400"></i>
            </button>
            <div id="category-menu" class="hidden mt-2 bg-white/95 backdrop-glass rounded-2xl shadow-2xl border border-slate-100 overflow-hidden absolute w-full z-30 transition-all">
                <button onclick="selectCategory('All')" class="w-full text-left px-5 py-3.5 hover:bg-orange-50 font-semibold text-sm border-b border-slate-100 flex items-center gap-3 transition text-slate-700"><i class="fa-solid fa-border-all text-orange-500"></i> Sabhi Saman (All)</button>
                <button onclick="selectCategory('General')" class="w-full text-left px-5 py-3.5 hover:bg-orange-50 font-semibold text-sm border-b border-slate-100 flex items-center gap-3 transition text-slate-700"><i class="fa-solid fa-basket-shopping text-orange-500"></i> General Grocery</button>
                <button onclick="selectCategory('Stationery')" class="w-full text-left px-5 py-3.5 hover:bg-orange-50 font-semibold text-sm border-b border-slate-100 flex items-center gap-3 transition text-slate-700"><i class="fa-solid fa-book text-orange-500"></i> Stationery & Books</button>
                <button onclick="selectCategory('Toys')" class="w-full text-left px-5 py-3.5 hover:bg-orange-50 font-semibold text-sm border-b border-slate-100 flex items-center gap-3 transition text-slate-700"><i class="fa-solid fa-gamepad text-orange-500"></i> Toys & Games</button>
                <button onclick="selectCategory('Household')" class="w-full text-left px-5 py-3.5 hover:bg-orange-50 font-semibold text-sm flex items-center gap-3 transition text-slate-700"><i class="fa-solid fa-house-laptop text-orange-500"></i> Household Goods</button>
            </div>
        </div>

        <div id="products-container" class="grid grid-cols-2 gap-4">
            </div>
    </main>

    <div class="sticky-bar backdrop-glass grid grid-cols-2 text-center py-2.5 shadow-xl">
        <a href="tel:9450222868" class="text-blue-600 font-extrabold text-xs flex flex-col items-center justify-center gap-1 transition active:scale-95">
            <i class="fa-solid fa-phone-volume text-xl"></i> Direct Call
        </a>
        <a href="https://wa.me/9450222868" target="_blank" class="text-emerald-600 font-extrabold text-xs flex flex-col items-center justify-center gap-1 transition active:scale-95">
            <i class="fa-brands fa-whatsapp text-2xl"></i> WhatsApp Shop
        </a>
    </div>

    <script>
        let allProducts = [];
        let currentCategory = 'All';
        let currentLang = 'HI';

        const dict = {
            HI: { search: "Saman ka naam dhundhein", call: "Direct Call", shop: "WhatsApp शॉप", mrp: "Rs. " },
            EN: { search: "Search for any item...", call: "Direct Call", shop: "WhatsApp Shop", mrp: "MRP: " }
        };

        async function fetchConfigAndProducts() {
            try {
                const bRes = await fetch('/api/ai-banner');
                const banner = await bRes.json();
                if(banner && banner.active) {
                    document.getElementById('banner-text').innerText = banner.text;
                    document.getElementById('ai-banner').classList.remove('hidden');
                }
                
                const pRes = await fetch('/api/products');
                allProducts = await pRes.json();
                renderProducts();
            } catch(e) { console.error(e); }
        }

        function toggleCategoryMenu() {
            document.getElementById('category-menu').classList.toggle('hidden');
        }

        function selectCategory(cat) {
            currentCategory = cat;
            document.getElementById('cat-title').innerHTML = cat === 'All' ? '⚡ Sabhi Saman (All)' : `⚡ ${cat}`;
            toggleCategoryMenu();
            renderProducts();
        }

        function filterProducts() { renderProducts(); }

        function toggleLanguage() {
            currentLang = currentLang === 'HI' ? 'EN' : 'HI';
            document.getElementById('lang-btn').innerText = currentLang === 'HI' ? 'EN' : 'HI';
            document.getElementById('search-input').placeholder = dict[currentLang].search;
            renderProducts();
        }

        function renderProducts() {
            const container = document.getElementById('products-container');
            container.innerHTML = '';
            const query = document.getElementById('search-input').value.toLowerCase();

            const filtered = allProducts.filter(p => {
                const matchCat = (currentCategory === 'All' || p.category === currentCategory);
                const matchQuery = p.name.toLowerCase().includes(query) || (p.description && p.description.toLowerCase().includes(query));
                return matchCat && matchQuery;
            });

            filtered.forEach(p => {
                const calculatedMRP = Math.round(p.price * 1.25);
                const isHighDemand = p.clicks >= 5;

                const card = document.createElement('div');
                card.className = "bg-white rounded-3xl overflow-hidden shadow-xs border border-slate-100 flex flex-col relative transition-all duration-200 hover:shadow-md active:scale-95";
                
                card.innerHTML = `
                    ${isHighDemand ? 
                        `<span class="absolute top-2.5 left-2.5 bg-gradient-to-r from-red-500 to-orange-500 text-white text-[9px] font-black px-2 py-0.5 rounded-full shadow-sm z-10 tracking-wide uppercase flex items-center gap-0.5"><i class="fa-solid fa-fire text-[8px] animate-bounce"></i> DEMAND HIGH</span>` : 
                        `<span class="absolute top-2.5 left-2.5 bg-slate-900/90 backdrop-glass text-amber-400 text-[9px] font-bold px-2 py-0.5 rounded-full z-10 shadow-xs flex items-center gap-0.5 border border-white/10"><i class="fa-solid fa-star text-[8px]"></i> BESTSELLER</span>`
                    }
                    
                    <div class="w-full pt-[100%] relative bg-gradient-to-b from-slate-50 to-white/30">
                        <img src="${p.image || 'https://via.placeholder.com/150'}" class="absolute inset-0 w-full h-full object-contain p-2.5" loading="lazy">
                    </div>

                    <div class="p-3.5 flex-1 flex flex-col">
                        <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-0.5">${p.category || 'General'}</span>
                        <h3 class="font-bold text-slate-800 text-sm leading-snug mb-2 line-clamp-2 h-9">${p.name}</h3>
                        <div class="mt-auto">
                            <div class="flex items-baseline gap-1.5 mb-2.5">
                                <span class="text-xl font-black text-orange-600">₹${p.price}</span>
                                <span class="text-[10px] text-slate-400 line-through font-medium">${dict[currentLang].mrp}${calculatedMRP}</span>
                            </div>
                            
                            <div class="flex flex-col gap-2 mt-2">
                                <button onclick="registerClick('${p._id}', '${p.name}')" class="pulse-btn w-full bg-gradient-to-r from-emerald-500 to-green-600 hover:from-emerald-600 hover:to-green-700 text-white text-[12px] font-black py-2.5 px-2 rounded-xl shadow-md hover:shadow-lg flex items-center justify-center gap-1.5 transition duration-150">
                                    <i class="fa-brands fa-whatsapp text-sm"></i> ${dict[currentLang].shop}
                                </button>
                                <a href="tel:9450222868" class="w-full bg-slate-50 text-slate-600 border border-slate-200/60 hover:bg-slate-100 text-[11px] font-bold py-1.5 px-2 rounded-xl flex items-center justify-center gap-1 transition">
                                    <i class="fa-solid fa-phone text-[10px]"></i> ${dict[currentLang].call}
                                </a>
                            </div>

                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function registerClick(id, name) {
            try {
                await fetch(`/api/products/click/${id}`, { method: 'POST' });
                const msg = encodeURIComponent(`Hi! Mujhe Shiv Shakti Super Mart se ye saman chahiye:\n📦 Saman: ${name}\n\nKripya mera order confirm karein.`);
                window.open(`https://wa.me/9450222868?text=${msg}`, '_blank');
                fetchConfigAndProducts();
            } catch(e) { console.error(e); }
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) return alert("Apka browser voice search support nahi karta.");
            const rec = new SpeechRecognition(); rec.lang = 'hi-IN';
            rec.onstart = () => { document.getElementById('search-input').placeholder = "🎤 Aap boliye, Mai sun raha hu..."; };
            rec.onresult = (e) => {
                document.getElementById('search-input').value = e.results[0][0].transcript;
                document.getElementById('search-input').placeholder = dict[currentLang].search;
                filterProducts();
            };
            rec.start();
        }

        window.onload = fetchConfigAndProducts;
    </script>
</body>
</html>
