<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiv Shakti Super Mart</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .custom-scroll::-webkit-scrollbar { display: none; }
        .custom-scroll { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes marquee { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }
        .animate-marquee { animation: marquee 25s linear infinite; }
    </style>
</head>
<body class="bg-[#070b14] min-h-screen text-slate-300 font-sans selection:bg-orange-500 selection:text-black">

    <div class="bg-gradient-to-r from-orange-600 to-amber-500 text-slate-950 py-2.5 font-black text-xs uppercase overflow-hidden shadow-lg border-b border-orange-500/20">
        <div class="whitespace-nowrap animate-marquee flex items-center gap-4">
            <span id="top-marquee-text">💥 AGRAHUNDA SUPER DEAL: Kam daam me sabsetop item! 💥</span>
        </div>
    </div>

    <header class="sticky top-0 bg-[#070b14]/80 backdrop-blur-xl border-b border-white/5 z-40 px-4 py-4">
        <div class="max-w-md mx-auto flex flex-col gap-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-gradient-to-tr from-orange-500 to-amber-400 rounded-2xl flex items-center justify-center shadow-lg shadow-orange-500/20">
                        <i class="fa-solid fa-shop text-slate-950 font-black text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-black text-white text-base tracking-tight">SHIV SHAKTI</h1>
                        <p class="text-[10px] text-orange-400 font-bold uppercase tracking-widest">Super Mart • Agrahunda</p>
                    </div>
                </div>
                <a href="/admin" class="w-9 h-9 bg-white/5 border border-white/5 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-user-gear text-sm"></i>
                </a>
            </div>

            <div class="relative flex items-center gap-2">
                <div class="relative flex-1">
                    <input type="text" id="search-input" oninput="filterProducts()" placeholder="Saman ka naam dhoondhein..." class="w-full bg-[#111827] border border-white/5 py-3.5 pl-11 pr-4 rounded-2xl text-sm text-white placeholder-slate-500 outline-none focus:border-orange-500/30 transition">
                    <i class="fa-solid fa-magnifying-glass absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-sm"></i>
                </div>
                <button onclick="startVoiceSearch()" class="w-12 h-12 bg-white/5 border border-white/5 rounded-2xl flex items-center justify-center text-slate-400 active:bg-orange-500 active:text-slate-950 transition">
                    <i id="mic-icon" class="fa-solid fa-microphone text-base"></i>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 pt-6 pb-24">
        <div class="flex gap-2 overflow-x-auto custom-scroll mb-8 pb-1">
            <button onclick="switchCategory('All')" class="cat-btn px-5 py-2.5 rounded-2xl text-xs font-black transition whitespace-nowrap bg-orange-500 text-slate-950 shadow-lg shadow-orange-500/10">All Stock</button>
            <button onclick="switchCategory('General')" class="cat-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap bg-white/5 border border-white/5 text-slate-400">Grocery</button>
            <button onclick="switchCategory('Stationery')" class="cat-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap bg-white/5 border border-white/5 text-slate-400">Stationery</button>
            <button onclick="switchCategory('Toys')" class="cat-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap bg-white/5 border border-white/5 text-slate-400">Toys</button>
            <button onclick="switchCategory('Household')" class="cat-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap bg-white/5 border border-white/5 text-slate-400">Household</button>
        </div>

        <div id="products-grid" class="grid grid-cols-2 gap-4"></div>

        <div id="empty-state" class="hidden text-center py-16">
            <div class="w-16 h-16 bg-white/5 rounded-3xl flex items-center justify-center mx-auto mb-4">
                <i class="fa-solid fa-box-open text-slate-600 text-xl"></i>
            </div>
            <p class="text-sm font-bold text-slate-500">Ye saman abhi dukan me nahi hai.</p>
        </div>
    </main>

    <div id="product-modal" class="fixed inset-0 bg-[#070b14]/90 backdrop-blur-md z-50 flex items-end justify-center p-0 hidden">
        <div class="bg-[#0b1120] w-full max-w-md rounded-t-[36px] border-t border-white/10 p-6 shadow-2xl flex flex-col gap-5 max-h-[85vh] overflow-y-auto custom-scroll">
            <div class="w-12 h-1.5 bg-slate-700 rounded-full mx-auto" onclick="closeModal()"></div>
            <img id="modal-image" src="" class="w-full h-56 object-contain bg-white/5 rounded-3xl p-2">
            <div>
                <span id="modal-cat" class="text-[10px] font-black tracking-widest uppercase text-orange-400 bg-orange-500/10 px-2.5 py-1 rounded-md">General</span>
                <h2 id="modal-name" class="text-xl font-black text-white mt-3">Saman ka Naam</h2>
                <p id="modal-desc" class="text-xs text-slate-400 mt-2 leading-relaxed">Description goes here...</p>
            </div>
            <div class="flex items-center justify-between border-t border-white/5 pt-4 mt-2">
                <div>
                    <span class="text-[10px] text-slate-500 block font-bold uppercase">Best Price</span>
                    <span id="modal-price" class="text-2xl font-black text-white">₹0</span>
                </div>
                <button onclick="orderViaWhatsApp()" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-black text-xs px-6 py-4 rounded-2xl flex items-center gap-2 shadow-lg shadow-emerald-500/10 transition">
                    <i class="fa-brands fa-whatsapp text-base"></i> Order on WhatsApp
                </button>
            </div>
        </div>
    </div>

    <script>
        let allProducts = [];
        let currentCategory = 'All';
        let activeProduct = null;

        window.onload = () => {
            loadBanner();
            loadProducts();
        };

        async function loadBanner() {
            const res = await fetch('/api/ai-banner');
            const data = await res.json();
            if(data && data.text) document.getElementById('top-marquee-text').innerText = data.text;
        }

        async function loadProducts() {
            const res = await fetch('/api/products');
            allProducts = await res.json();
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('products-grid');
            const empty = document.getElementById('empty-state');
            grid.innerHTML = '';

            const searchWord = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => {
                const matchesCat = currentCategory === 'All' || p.category === currentCategory;
                const matchesSearch = p.name.toLowerCase().includes(searchWord);
                return matchesCat && matchesSearch;
            });

            if(filtered.length === 0) { empty.classList.remove('hidden'); } 
            else {
                empty.classList.add('hidden');
                filtered.forEach(p => {
                    const card = document.createElement('div');
                    card.className = "bg-white/5 rounded-[28px] border border-white/5 p-3 flex flex-col justify-between gap-3 shadow-xl hover:border-white/10 transition";
                    card.onclick = () => openModal(p);
                    card.innerHTML = `
                        <div class="relative bg-white/5 rounded-2xl p-2 h-32 flex items-center justify-center overflow-hidden">
                            <img src="${p.image}" class="w-full h-full object-contain">
                        </div>
                        <div class="px-1 pb-1">
                            <h3 class="font-bold text-xs text-white truncate">${p.name}</h3>
                            <div class="flex items-center justify-between mt-2">
                                <span class="text-sm font-black text-white">₹${p.price}</span>
                                <span class="text-[9px] font-black text-orange-400 bg-orange-500/10 px-2 py-0.5 rounded">View</span>
                            </div>
                        </div>
                    `;
                    grid.appendChild(card);
                });
            }
        }

        function filterProducts() { renderProducts(); }

        function switchCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn px-5 py-2.5 rounded-2xl text-xs font-bold transition whitespace-nowrap bg-white/5 border border-white/5 text-slate-400";
                if(btn.innerText.includes(cat) || (cat==='All' && btn.innerText==='All Stock')) {
                    btn.className = "cat-btn px-5 py-2.5 rounded-2xl text-xs font-black transition whitespace-nowrap bg-orange-500 text-slate-950 shadow-lg";
                }
            });
            renderProducts();
        }

        function openModal(product) {
            activeProduct = product;
            document.getElementById('modal-image').src = product.image;
            document.getElementById('modal-cat').innerText = product.category;
            document.getElementById('modal-name').innerText = product.name;
            document.getElementById('modal-desc').innerText = product.description || 'Fresh stock available at shop.';
            document.getElementById('modal-price').innerText = `₹${product.price}`;
            document.getElementById('product-modal').classList.remove('hidden');
            fetch(`/api/products/${product._id}`, { method: 'POST' }).catch(() => {});
        }

        function closeModal() { document.getElementById('product-modal').classList.add('hidden'); }

        function orderViaWhatsApp() {
            if(!activeProduct) return;
            const msg = `नमस्ते शिव शक्ति सुपर मार्ट, मुझे ये आइटम खरीदना है:\n\n*सामान का नाम:* ${activeProduct.name}\n*कीमत:* ₹${activeProduct.price}\n\nकृपया स्टॉक चेक करके बताएं।`;
            window.open(`https://wa.me/919140134493?text=${encodeURIComponent(msg)}`, '_blank');
        }

        function startVoiceSearch() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) { alert("Voice search not supported."); return; }
            const rec = new SpeechRecognition();
            rec.lang = 'hi-IN';
            const icon = document.getElementById('mic-icon');
            rec.onstart = () => icon.className = "fa-solid fa-circle-dot text-red-500 animate-pulse";
            rec.onend = () => icon.className = "fa-solid fa-microphone text-base";
            rec.onresult = (e) => {
                const text = e.results[0][0].transcript.replace(/[.।]/g, '').trim();
                document.getElementById('search-input').value = text;
                renderProducts();
            };
            rec.start();
        }
    </script>
</body>
</html>
