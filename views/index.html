<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shiv Shakti Super Mart - Agrahunda</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .backdrop-glass { backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
        .product-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); border: 1px solid rgba(255,255,255,0.03); }
        .product-card:hover { transform: translateY(-5px); border-color: rgba(249, 115, 22, 0.3); box-shadow: 0 15px 25px -5px rgba(249, 115, 22, 0.15); }
        .neon-text-orange { text-shadow: 0 0 10px rgba(249, 115, 22, 0.4); }
    </style>
</head>
<body class="bg-[#030712] min-h-screen font-sans pb-24 antialiased text-slate-300">

    <div id="top-flash-banner" class="bg-gradient-to-r from-amber-500 via-orange-600 to-red-600 text-white text-center py-2 px-4 text-xs font-black tracking-wide shadow-lg flex items-center justify-center gap-2">
        <i class="fa-solid fa-fire text-amber-200 animate-bounce"></i>
        <span id="banner-text-loader">💥 AGRAHUNDA SUPER DEAL: Kam daam me sabsetop item, ek baar click karke khud rate dekhein! 💥</span>
    </div>

    <div class="max-w-md mx-auto px-4 pt-5">
        
        <header class="flex items-center justify-between mb-6 p-4 bg-[#0f172a]/80 backdrop-glass rounded-[24px] border border-slate-800 shadow-xl">
            <div>
                <h1 class="font-black text-xl tracking-tight text-white flex items-center gap-2">
                    <span class="text-orange-500 neon-text-orange"><i class="fa-solid fa-shop"></i></span> Shiv Shakti Mart
                </h1>
                <p class="text-[10px] text-slate-400 font-bold flex items-center gap-1 mt-0.5">
                    <i class="fa-solid fa-location-dot text-red-500"></i> Agrahunda, Chitrakoot
                </p>
            </div>
            <a href="/admin" class="bg-gradient-to-r from-slate-800 to-slate-900 border border-slate-700 text-white px-3 py-2 rounded-xl text-[11px] font-black tracking-wide transition flex items-center gap-1.5 shadow-md">
                <i class="fa-solid fa-user-shield text-amber-400"></i> Admin
            </a>
        </header>

        <div class="relative mb-6">
            <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-slate-500 text-sm"></i>
            <input type="text" id="search-input" oninput="filterProducts()" placeholder="Saman ka naam dhundhein..." class="w-full bg-[#0f172a]/90 border border-slate-800 pl-11 pr-11 py-3.5 text-sm text-white rounded-2xl outline-none focus:border-orange-500 font-medium placeholder-slate-500 shadow-inner transition">
        </div>

        <div id="customer-products-grid" class="grid grid-cols-2 gap-4">
            </div>
    </div>

    <footer class="fixed bottom-0 inset-x-0 bg-[#030712]/90 backdrop-glass border-t border-slate-800/80 py-3.5 px-6 flex items-center justify-around z-40 max-w-md mx-auto shadow-2xl">
        <a href="tel:919211000000" class="flex flex-col items-center gap-1 text-slate-400 hover:text-white transition">
            <i class="fa-solid fa-phone-volume text-lg"></i>
            <span class="text-[9px] font-black uppercase tracking-wider">Direct Call</span>
        </a>
        <a href="https://wa.me/919211000000" target="_blank" class="flex flex-col items-center gap-1 text-emerald-400 hover:text-emerald-300 transition">
            <i class="fa-solid fa-circle-nodes text-xl animate-pulse text-emerald-500"></i>
            <span class="text-[9px] font-black uppercase tracking-wider">WhatsApp Shop</span>
        </a>
    </footer>

    <script>
        let allProducts = [];

        async function initializeStorefront() {
            try {
                const bRes = await fetch('/api/ai-banner');
                const bData = await bRes.json();
                if(bData && bData.active) {
                    document.getElementById('banner-text-loader').innerText = bData.text;
                }

                const pRes = await fetch('/api/products');
                allProducts = await pRes.json();
                renderCustomerGrid(allProducts);
            } catch (e) { console.error(e); }
        }

        function renderCustomerGrid(products) {
            const grid = document.getElementById('customer-products-grid');
            if(!grid) return;
            grid.innerHTML = '';

            if(!products || products.length === 0) {
                grid.innerHTML = `<div class="col-span-2 text-center text-slate-600 font-black py-16 text-sm">Dukan par abhi koi saman live nahi hai. Admin panel se saman chadhayein!</div>`;
                return;
            }

            products.forEach(p => {
                let thumbUrl = 'https://via.placeholder.com/150';
                if(p.image) thumbUrl = p.image;
                else if(p.images && p.images.length > 0) thumbUrl = p.images[0];

                const card = document.createElement('div');
                card.className = "product-card bg-gradient-to-b from-[#0f172a] to-slate-950 rounded-[28px] p-3.5 flex flex-col justify-between gap-3 relative shadow-xl overflow-hidden";
                
                card.innerHTML = `
                    <div>
                        <div class="w-full pt-[100%] relative bg-slate-950/60 rounded-2xl overflow-hidden mb-2.5 border border-slate-900 shadow-inner">
                            <span class="absolute left-2 top-2 bg-orange-600/90 text-slate-950 font-black text-[8px] uppercase tracking-widest px-2 py-0.5 rounded-md z-10 border border-orange-500/20"><i class="fa-solid fa-star text-[7px]"></i> Live</span>
                            <img src="${thumbUrl}" class="absolute inset-0 w-full h-full object-contain p-1" onerror="this.src='https://via.placeholder.com/150'">
                        </div>
                        <div class="px-0.5">
                            <span class="text-[8px] uppercase font-black tracking-widest text-orange-400 block">${p.category || 'General'}</span>
                            <h3 class="font-black text-sm text-white tracking-tight line-clamp-1 mt-0.5">${p.name}</h3>
                            <p class="text-[10px] text-slate-400 line-clamp-2 mt-1 leading-snug font-medium h-7">${p.description || 'No description available'}</p>
                        </div>
                    </div>
                    <div class="mt-2 flex flex-col gap-2">
                        <div class="flex items-baseline gap-1.5 px-0.5">
                            <span class="text-xl font-black text-transparent bg-clip-text bg-gradient-to-r from-orange-400 to-amber-500">₹${p.price}</span>
                            <span class="text-[10px] text-slate-600 font-bold line-through">MRP: ₹${Math.floor(p.price * 1.3)}</span>
                        </div>
                        <button onclick="registerProductClick('${p._id}', '${p.name}')" class="w-full bg-gradient-to-r from-emerald-500 to-teal-500 hover:from-emerald-400 text-slate-950 py-3 rounded-xl font-black text-xs shadow-md transition flex items-center justify-center gap-1.5 uppercase tracking-wider active:scale-95">
                            <i class="fa-brands fa-whatsapp text-sm"></i> Order Karein
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        async function registerProductClick(id, name) {
            try {
                await fetch(`/api/products/click/${id}`, { method: 'POST' });
                const waMessage = `Namaste Shiv Shakti Super Mart, mujhe ye saman chahiye:\n\nSaman ka Naam: *${name}*\n\nKripya order pakka karein.`;
                window.open(`https://wa.me/919211000000?text=${encodeURIComponent(waMessage)}`, '_blank');
            } catch(e) { console.error(e); }
        }

        function filterProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => (p.name || '').toLowerCase().includes(query));
            renderCustomerGrid(filtered);
        }

        window.addEventListener('DOMContentLoaded', initializeStorefront);
    </script>
</body>
</html>
